# REUSE.toml — per-file licensing for an aggregation repository.
# Spec: REUSE 3.3 (https://reuse.software/spec-3.3/)
#
# This repository is a DATA AGGREGATION. It does not relicense anything it
# redistributes: each dataset keeps the license it arrived under, declared here.
# `precedence = "aggregate"` is REUSE's own term for exactly this arrangement —
# the annotation applies unless a file declares otherwise itself.
#
# Practical consequence worth understanding: GPL-2.0-only (ggPMX) and
# GPL-3.0-or-later (nlmixr2data) are mutually incompatible *in a combined work*
# but coexist without conflict as mere aggregation, which is what this repo is.
# It also means no single license can ever be applied to the repository as a
# whole, so don't add a bare top-level LICENSE that implies one. See LICENSE.md.
#
# Verify with:  pipx run reuse lint

version = 1
SPDX-PackageName = "pkpd-data"
SPDX-PackageSupplier = "Quantum Innovation Challenge <contact@quantum-challenge.eu>"
SPDX-PackageDownloadLocation = "https://github.com/Quantum-Innovation-Challenge/pkpd-data"
SPDX-PackageComment = """
Aggregation of third-party pharmacokinetic/pharmacodynamic datasets plus
challenge-owned synthetic data. Licenses are declared per dataset below.
"""


# ─────────────────────────────────────────────────────────────────────────
# Challenge-owned synthetic data — CC0-1.0
# Generated by the challenge organisers, who therefore set the terms.
# CC0 is deliberate: it removes any question about the license status of
# models trained on this data, which is what makes it the preferred basis
# for publishable blind evaluations.
# ─────────────────────────────────────────────────────────────────────────

[[annotations]]
path = ["evaluation_data_phase3/**", "data/qic/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Quantum Innovation Challenge"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = """
Synthetic PK/PD data generated for the challenge. UpdatedEstData.csv is the
phase-3 released estimation set — distributed to participants and trained on,
therefore NOT suitable as a blind holdout. See data/qic/README.md.
"""


# ─────────────────────────────────────────────────────────────────────────
# DDMoRe Model Repository — CC0-1.0
# All repository entries are uploaded/downloaded under the CC0 Public Domain
# Dedication (repository.ddmore.foundation terms of use). Verified 2026-08.
# ─────────────────────────────────────────────────────────────────────────

[[annotations]]
path = "data/pk/bedaquiline/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "DDMoRe Foundation model repository contributors"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = """
Simulated from the accompanying NONMEM control stream; multi-analyte
(TMC207, M2, LPV, RTV) with BQL/LLOQ censoring on 114 records.
PROVENANCE CORRECTION 2026-08-08: the README's ddmore_scraping/tree/master/219
attribution is WRONG. Entry 219 is a different Svensson model
(BDQ_M2_PK_plus_WT_ALB_in_MDR-TB_patients) and these files appear nowhere in
that mirror. The control stream names its author (Elin Svensson) and study
(BDQ + M2 with lopinavir/ritonavir = AAC 2014;58(11):6406), but the route by
which the files reached this repo is unrecorded, so the CC0 claim rests on the
DDMoRe naming convention, not on a verified source.
"""

[[annotations]]
path = "data/pk_pd/ciprofloxacin/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "DDMoRe Foundation model repository contributors"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = """
CONFIRMED 2026-08-08: both files are byte-identical (sha256) to DDMoRe entry 225
as mirrored at github.com/dpastoor/ddmore_scraping/tree/master/225. Underlying
study named in the control stream: Khan DD, et al., J Antimicrob Chemother
2015;70(11):3051-60.
"""

# TODO(provenance): the two entries below are grouped under "DDMoRe Foundation
# Data and other datasets" in the README, carry no per-dataset upstream URL, and
# — unlike ciprofloxacin — are NOT present in the ddmore_scraping mirror, so the
# DDMoRe attribution rests on file-naming convention alone. Note that
# repository.ddmore.foundation itself returned HTTP 503 when checked 2026-08-08,
# so there is currently no way to confirm at source.
[[annotations]]
path = [
  "data/pk_pd/tcell_mAb_multiplesclerois/**",
  "data/pk_pd/semimech_antibiotics/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "DDMoRe Foundation model repository contributors"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = "PROVENANCE UNCONFIRMED — assumed DDMoRe/CC0, pending verification."


# ─────────────────────────────────────────────────────────────────────────
# nlmixr2data — GPL-3.0-or-later
# CRAN DESCRIPTION: License GPL (>= 3). Verified 2026-08.
# ─────────────────────────────────────────────────────────────────────────

[[annotations]]
path = ["data/pk/theophylline/nlmixr2data/**", "data/pk_pd/warfarin/nlmixr2data/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "nlmixr2data authors (Matthew Fidler, Wenping Wang, et al.)"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = """
Redistributed from github.com/nlmixr2/nlmixr2data. Underlying warfarin study:
O'Reilly RA, Aggeler PM, Circulation 1968;38:169-77.
NOTE: whether model weights trained on GPL data constitute a derivative work is
unsettled in every jurisdiction. Prefer CC0 sources for publishable blind runs.
"""


# ─────────────────────────────────────────────────────────────────────────
# ggPMX test data — GPL-2.0-only
# CRAN DESCRIPTION: License GPL-2 (not "or later"). © Novartis Pharma AG.
# Verified 2026-08.
# ─────────────────────────────────────────────────────────────────────────

[[annotations]]
path = "data/pk/theophylline/ggpmx/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Novartis Pharma AG and ggPMX contributors"
SPDX-License-Identifier = "GPL-2.0-only"
SPDX-FileComment = """
From ggPMX inst/testdata/theophylline. GPL-2.0-ONLY: incompatible with GPL-3
and with Apache-2.0 in a combined work — fine as aggregation, but do not vendor
into qic-pkpd-core (Apache-2.0) or any GPL-3 work.
The Monolix/ subdirectory is a fitted NLME reference (pop_parameters, estimates,
indiv_eta, predictions), NOT input data. Loading it as a cohort is a category
error; it is the reference-fit arm of the validation tier.
"""


# ─────────────────────────────────────────────────────────────────────────
# UNRESOLVED — redistribution permission not established.
# Aggregation framing does NOT cure this: hosting a file here is still
# redistribution of that file. These need resolution or removal.
# ─────────────────────────────────────────────────────────────────────────

[[annotations]]
path = "data/pk_pd/remifentanil/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-Unresolved-Monolix-Demo"
SPDX-FileComment = """
Sourced from a Monolix (Lixoft / Simulations Plus) demo dataset. The suite
documentation is proprietary; whether the demo DATASETS may be redistributed is
a separate question that has not been answered. Underlying study: Minto et al.,
Anesthesiology 1997 (PMID 9009935, 9009936).
The warfarin Monolix file that shared this identifier was DELETED 2026-08-08 as
redundant with the GPL-3 nlmixr2data copy. Remifentanil has no equally clean
substitute, but see its PROVENANCE.yaml: the same 65 subjects are published by
the study's own authors via the Open TCI Initiative (opentci.org), which is a
better party to ask than Simulations Plus.
"""

[[annotations]]
path = "data/pk/moxifloxacin/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-Unresolved-NoProvenance"
SPDX-FileComment = """
README attributes this to a personal Naver blog post
(m.blog.naver.com/kimmingul/220803637586), which grants nothing.
TRACED 2026-08-08: the control stream names its author (Sebastian G. Wicha,
Freie Universitaet Berlin) and its THETAs (CL 12.1, V1 68.1, Q 20.3, V2 44.6 with
IBW**0.75 on CL and WGT on V1/V2) reproduce the published final model of
Wicha SG, et al., J Clin Pharmacol 2015;55(6):639-46, doi 10.1002/jcph.464 —
50 patients, matching the 50 subjects in the CSV. So there is now an identifiable
rights holder to ask, but still no grant: status stays unresolved.
"""


# ─────────────────────────────────────────────────────────────────────────
# This repository's own curation layer — CC-BY-4.0
# Manifest, provenance records, ground-truth extractions, documentation.
# Attribution-only, so it never constrains downstream users of the data.
# ─────────────────────────────────────────────────────────────────────────

[[annotations]]
path = ["README.md", "LICENSE.md", "MANIFEST.yaml", "CHECKSUMS.sha256",
        "REUSE.toml", "PROVENANCE.template.yaml",
        "**/PROVENANCE.yaml", "**/README.md"]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Quantum Innovation Challenge"
SPDX-License-Identifier = "CC-BY-4.0"

# Tooling is code, not curation prose, so it takes the code license used across
# the programme (Apache-2.0, as in qic-pkpd-core) rather than CC-BY-4.0.
# It contains no data and is derived from none, so nothing is inherited.
[[annotations]]
path = ["tools/**", ".github/**"]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Quantum Innovation Challenge"
SPDX-License-Identifier = "Apache-2.0"

# Ground-truth parameter extractions are DERIVATIVE WORKS of the .mod control
# streams they come from, so each inherits its source's license rather than the
# curation license. Declared per file to keep that explicit.
[[annotations]]
path = "ground_truth/bedaquiline.yaml"
precedence = "aggregate"
SPDX-FileCopyrightText = "DDMoRe Foundation model repository contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "ground_truth/ciprofloxacin.yaml"
precedence = "aggregate"
SPDX-FileCopyrightText = "DDMoRe Foundation model repository contributors"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = "Inherits the source .mod license; source confirmed (DDMoRe entry 225)."

[[annotations]]
path = ["ground_truth/tcell_mab.yaml", "ground_truth/semimech_antibiotics.yaml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "DDMoRe Foundation model repository contributors"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = "Inherits the source .mod license; unconfirmed, see above."
