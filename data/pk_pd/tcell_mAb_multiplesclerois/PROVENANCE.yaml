notes: >
  PROVENANCE UNCONFIRMED, and the weakest evidence of the three DDMoRe-assumed
  sets. Checked 2026-08-08: not in the ddmore_scraping mirror (which does hold a
  different multiple-sclerosis entry, 223, Novakovic 2016 cladribine — not this
  one); the control stream carries a run-record header (";; 1. Based on: 43",
  ";;Date of run 2003-03-13") but names NO author and NO publication, unlike
  every other .mod in this corpus. So there is nothing here to trace to yet.
  Next step: the 2003 run date plus the two-compartment PK with additive IIV on
  Baseline and exponential IIV on EC50 should be enough to identify the study
  from the pharmacometrics literature; failing that, treat as unresolved rather
  than CC0 before any published use.
  The directory name misspells "sclerosis" as "multiplesclerois"; the .mod file
  spells it correctly. Left as-is because the README and the GitHub URL in it
  both point at the misspelled path — rename it in a change of its own if at all.
  Individual PK parameters (ICL, IV1, IQ, IV2) are carried per subject, so the
  generating parameters are recoverable per individual, not only per population.
  Used by no solution repo.
