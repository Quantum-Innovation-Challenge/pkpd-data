notes: >
  GPL-3.0-or-later; development/validation material only, not for publishable
  blind runs — see the theophylline nlmixr2data record for why.
  THIS IS NOW THE ONLY WARFARIN COPY IN THE CORPUS. A second copy,
  ../monolix/warfarin_data.txt (a MonolixSuite demo encoding under an unresolved
  license), was DELETED 2026-08-08 as redundant. Verified before deleting by
  reading both: time, wt and age matched row-for-row across all 515 rows, and the
  differences were purely cosmetic. Anyone who was reading the Monolix encoding
  can switch to this file with a rename:

    monolix id -> id (ids were 100+, here 1-32)
    monolix dvid 1/2 -> dvid factor levels cp/pca
    monolix sex 0/1 -> sex factor levels female/male
    monolix missing "." on dosing rows -> dv = 0, with evid marking the dose

  This copy additionally carries an explicit evid column, which the deleted one
  did not. Shapes and the comparison were read from the files, not package docs.
