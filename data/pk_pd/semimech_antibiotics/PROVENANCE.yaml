notes: >
  PROVENANCE UNCONFIRMED as to the DDMoRe entry, but the SOURCE STUDY is now
  identified (2026-08-08) from the control stream's own $PROBLEM line, and the
  model structure corroborates it: COMP=(S) growing susceptible and COMP=(R)
  resting insensitive bacterial subpopulations are exactly the two-subpopulation
  design of Nielsen 2007. Unlike ciprofloxacin, these files are NOT in the
  ddmore_scraping mirror, so the CC0 annotation still rests on naming convention.
  Note the same first author (Nielsen) and group (Uppsala, Karlsson/Friberg)
  connect this to the confirmed-CC0 ciprofloxacin entry — weak corroboration that
  both arrived by the same route, not proof.
  These two files previously sat loose in data/pk_pd/ alongside the dataset
  subdirectories. Moved into their own directory so a per-directory
  PROVENANCE.yaml can cover them without a record at data/pk_pd/ silently
  adopting any future dataset added there without one.
  The only .tab (NONMEM table) file in the corpus, and the only one needing the
  preamble skip.
