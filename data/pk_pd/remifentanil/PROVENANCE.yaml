content:
  synthetic: false                     # real trial data
  ground_truth_model: none
  subjects: 65
  rows: 6046
  analytes: [remifentanil_concentration, eeg_effect]
  columns: [ID, TIME, AMT, RATE, DV, YTYPE, MDV, AGE, SEX, LBM, TINFCAT]
