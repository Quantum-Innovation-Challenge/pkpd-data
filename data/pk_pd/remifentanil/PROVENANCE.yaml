notes: >
  BLOCKED ON LICENSING — do not use in any published result until resolved.
  Aggregation framing does not help here: hosting this file is redistribution of
  it, and no permission to redistribute has been established.
  Dropping is not cost-free for this one, unlike warfarin: pharmaceutiq's
  src/remifentanil_pipeline.py is built on it and it is the corpus's only
  infusion-dosing PK/PD set with an effect endpoint. Ask first, remove second.

  WHO TO ASK, established 2026-08-08. No CC0 or GPL copy of this data exists that
  I could find — it is not in nlmixr2data, PKPDdatasets or the DDMoRe mirror. But
  the same 65 subjects are published by the study's own authors through the Open
  TCI Initiative: minto_remi.zip contains server/comp_pk/REMI.DAT (the NONMEM PK
  data, 65 subjects) and server/comp_pd/KE0DATA.TXT (the EEG effect data), an
  archive of Steven Shafer's PK/PD software server. Verified as the same subjects
  by matching AGE and LBM per subject id: all 65 agree exactly.
  Open TCI states no license either, so this is not a clean substitute — but it
  is a much better party to ask than Simulations Plus, because Minto, Schnider
  and Shafer are the rights holders in the underlying data and they run Open TCI
  precisely to share it. Recommended: ask Open TCI for an explicit CC0/CC-BY
  statement covering the Minto 1997 data, and re-source the file from REMI.DAT
  once granted. That is the route that ends with this dataset clean rather than
  merely tolerated.
  Cite the Minto papers regardless of how redistribution resolves.
