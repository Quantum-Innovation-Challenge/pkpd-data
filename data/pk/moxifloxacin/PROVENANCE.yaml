notes: >
  STILL BLOCKED ON LICENSING — do not use in any published result — but no longer
  unattributable. TRACED 2026-08-08 from evidence inside the control stream,
  which the README's blog attribution had obscured:
    - it names its author, "Sebastian G. Wicha, Freie Universitaet Berlin";
    - its THETAs (CL 12.1, V1 68.1, Q 20.3, V2 44.6 L) reproduce the published
      final parameter estimates for a 70 kg patient exactly;
    - its covariate structure (IBW**0.75 on CL, WGT on V1 and V2) is the
      published final model;
    - the CSV has 50 subjects; the study enrolled 50 patients.
  The source is therefore Wicha et al. 2015 (see citation), not a blog. What is
  still missing is a GRANT: an author being identifiable is not permission.
  Two routes now open, in order of preference:
    1. Ask S. G. Wicha (now Universitaet Hamburg) directly — a named academic
       author is a far more tractable ask than an unattributed blog post.
    2. Find the corresponding DDMoRe repository entry, whose terms of use place
       entries under CC0. Note the files are NOT in the ddmore_scraping mirror,
       and repository.ddmore.foundation returned HTTP 503 on 2026-08-08.
  If neither lands, remove the files. Note the .mod reads MOX02_sim.csv, a
  filename that does not match the CSV shipped here — the CSV was renamed at some
  point in its travels, so the two are not guaranteed to be the same simulation.
