notes: >
  GPL-3.0-or-later. Development/validation material only: whether model weights
  trained on copyleft data are a derivative work is unsettled in every
  jurisdiction, so prefer the CC0 sets for publishable blind runs.
  Read the .rda directly (e.g. the Python rdata package) rather than calling into
  R — parsing the file format is not linking nlmixr2data; loading it via rpy2 may
  be. Shapes above were read from the files, not from the package docs.
  Note the theophylline in data/pk/theophylline/ggpmx/ is a DIFFERENT
  redistribution of theophylline-like data under GPL-2.0-only, which is
  incompatible with this one in a combined work. Keep them apart.
