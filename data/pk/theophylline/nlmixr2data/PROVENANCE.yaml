content:
  synthetic: false                     # classic Boeckmann/Sheiner/Beal study data
  ground_truth_model: none
  subjects: 12                         # 12 in each of theo_sd and theo_md
  rows: {theo_sd: 144, theo_md: 348}
  analytes: [theophylline]
  columns: [ID, TIME, DV, AMT, EVID, CMT, WT]
  censoring: none
  role: development

citation: >
