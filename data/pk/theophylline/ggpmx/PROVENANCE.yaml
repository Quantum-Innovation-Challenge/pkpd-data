notes: >
  GPL-2.0-ONLY — incompatible with GPL-3 and with Apache-2.0 in a combined work.
  Fine as aggregation; do NOT vendor into qic-pkpd-core (Apache-2.0) or into any
  GPL-3 work, and keep it apart from the GPL-3 nlmixr2data theophylline.
  The Monolix/ subdirectory is a fitted NLME reference — pop_parameters,
  estimates, indiv_eta, predictions, finegrid, plus SAEM convergence traces under
  ChartsData/. It is model OUTPUT, not input data; loading it as a cohort is a
  category error. It is the reference-fit arm of the validation tier.
  One dataset spanning three directory levels, hence one record covering the tree.
