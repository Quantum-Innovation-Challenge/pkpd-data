notes: >
  PROVENANCE DOWNGRADED 2026-08-08 — this was the one dataset believed fully
  verified, and it is not. The README attributes it to
  github.com/dpastoor/ddmore_scraping/tree/master/219, but entry 219 holds a
  DIFFERENT Svensson model (BDQ_M2_PK_plus_WT_ALB_in_MDR-TB_patients, the
  time-varying weight/albumin paper), and neither file here appears anywhere in
  that 641-file mirror. So the URL is wrong and the retrieval route is unknown.
  What the control stream does establish: ";; x1. Author: Elin Svensson",
  ";; 2. Description: BDQ + M2 and interacting drugs: lopinavir/ritonavir", and
  ";; 1. Based on: run674" — identifying the study as AAC 2014;58(11):6406, which
  is why the citation above was corrected (it previously named the 2013 efavirenz
  paper, a different interaction study).
  Practical effect: this dataset sits with tcell mAb and semimech antibiotics as
  "assumed DDMoRe/CC0, unconfirmed" rather than confirmed. It is not blocked —
  the DDMoRe naming convention is decent evidence — but do not describe it as
  verified. Contrast ciprofloxacin, which was confirmed by sha256 against the
  mirror.
  Multi-analyte with real BQL censoring (114 records verified in the BQL column)
  — the only dataset in the corpus exercising either capability. None of the
  three solution repos handle them as of the pre-kubeflow baseline.
  Used by no solution repo, so it is also a candidate transfer test.
